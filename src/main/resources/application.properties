spring.application.name=Backend
server.servlet.context-path=/api

# H2 file database (data survives restarts; stored in ./data/ejust.mv.db)
spring.datasource.url=jdbc:h2:file:./data/ejust
spring.datasource.username=sa
spring.datasource.password=

# run src/main/resources/schema.sql on every start (it only creates the table if missing)
spring.sql.init.mode=always
